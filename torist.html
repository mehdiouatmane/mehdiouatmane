                  >
                    <i className="fa-solid fa-cart-plus ml-1.5"></i>
                    {addedFeedback ? 'تمت الإضافة للسلة' : 'أضف إلى السلة'}
                  </button>
                  <button
                    type="button"
                    onClick={() => handleAdd(true)}
                    className="flex-1 bg-terracotta hover:bg-terracottaDark text-white font-bold py-3 px-4 rounded-xl text-sm transition"
                  >
                    إتمام الحجز الآن
                    <i className="fa-solid fa-arrow-left mr-1.5"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </section>
      );
    }

    function CheckoutFlow({ cart, onUpdateQuantity, onRemoveItem, onClearCart, onBackHome }) {
      const [step, setStep] = useState(1);
      const [customer, setCustomer] = useState({
        fullName: '',
        email: '',
        phone: '',
        nationality: 'France / Europe',
        pickupCity: 'Rabat',
      });
      const [submitting, setSubmitting] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');
      const [orderSuccess, setOrderSuccess] = useState(null);

      const subtotal = useMemo(
        () => cart.reduce((sum, item) => sum + item.unitPrice * item.quantity, 0),
        [cart]
      );

      const steps = [
        { num: 1, label: 'مراجعة السلة' },
        { num: 2, label: 'بيانات المسافر' },
        { num: 3, label: 'التأكيد والإرسال' },
      ];

      const handleSendToTelegram = async () => {
        setErrorMsg('');

        if (!customer.fullName.trim() || !customer.phone.trim()) {
          setErrorMsg('يرجى إدخال الاسم الكامل ورقم الهاتف أو واتساب لتأكيد الحجز.');
          setStep(2);
          return;
        }

        const itemsLines = cart
          .map(
            (item, i) =>
              `${i + 1}. ${item.title}\n   • التاريخ: ${item.date}\n   • الأشخاص: ${item.quantity} × $${item.unitPrice} = $${item.quantity * item.unitPrice}${
                item.notes ? `\n   • ملاحظة: ${item.notes}` : ''
              }`
          )
          .join('\n\n');

        const messageText = [
          '🧳 *طلب حجز سياحي جديد - Atlas Escapes Morocco*',
          '----------------------------------------',
          `👤 *الاسم:* ${customer.fullName}`,
          `📞 *الهاتف / WhatsApp:* ${customer.phone}`,
          `✉️ *البريد الإلكتروني:* ${customer.email || 'غير مذكور'}`,
          `🌍 *المنطقة / الجنسية:* ${customer.nationality}`,
          `📍 *نقطة الانطلاق:* ${customer.pickupCity}`,
          '----------------------------------------',
          '📌 *التجارب المحجوزة:*',
          itemsLines,
          '----------------------------------------',
          `💰 *المجموع الإجمالي التقديري:* $${subtotal}`,
        ].join('\n');

        if (
          TELEGRAM_CONFIG.botToken === 'YOUR_TELEGRAM_BOT_TOKEN' ||
          TELEGRAM_CONFIG.chatId === 'YOUR_TELEGRAM_CHAT_ID'
        ) {
          setOrderSuccess({
            demoMode: true,
            total: subtotal,
            preview: messageText,
          });
          onClearCart();
          setStep(3);
          return;
        }

        setSubmitting(true);
        try {
          const url = `https://api.telegram.org/bot${TELEGRAM_CONFIG.botToken}/sendMessage`;
          const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              chat_id: TELEGRAM_CONFIG.chatId,
              text: messageText,
              parse_mode: 'Markdown',
            }),
          });
          const data = await response.json();
          if (!response.ok || !data.ok) {
            throw new Error(data.description || 'تعذر إرسال الطلب إلى بوت تيليغرام');
          }
          setOrderSuccess({
            demoMode: false,
            total: subtotal,
            preview: messageText,
          });
          onClearCart();
          setStep(3);
        } catch (err) {
          setErrorMsg(err.message || 'حدث خطأ أثناء الإرسال، يرجى المحاولة مرة أخرى.');
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <section className="max-w-4xl mx-auto px-4 py-10">
          <div className="bg-white rounded-3xl shadow-md border border-slate-200/80 p-6 sm:p-8 space-y-8">
            <div>
              <h1 className="text-2xl sm:text-3xl font-extrabold text-atlanticDark">إتمام طلب الحجز</h1>
              <p className="text-sm text-slate-600 mt-1">خطوات بسيطة لإرسال طلب الحجز مباشرة إلى فريق التنسيق.</p>
            </div>

            <div className="grid grid-cols-3 gap-2 sm:gap-4">
              {steps.map((s) => {
                const active = step === s.num;
                const done = step > s.num || Boolean(orderSuccess);
                return (
                  <div
                    key={s.num}
                    className={`p-3 rounded-2xl border text-center transition ${
                      active
                        ? 'bg-atlanticDark text-white border-atlanticDark'
                        : done
                        ? 'bg-emerald-50 text-emerald-900 border-emerald-200'
                        : 'bg-slate-50 text-slate-500 border-slate-200'
                    }`}
                  >
                    <div className="text-xs font-extrabold">الخطوة {s.num}</div>
                    <div className="text-xs sm:text-sm font-bold mt-0.5">{s.label}</div>
                  </div>
                );
              })}
            </div>

            {errorMsg && (
              <div className="bg-red-50 border border-red-200 text-red-700 text-sm font-bold p-4 rounded-xl flex items-center gap-2">
                <i className="fa-solid fa-circle-exclamation"></i>
                <span>{errorMsg}</span>
              </div>
            )}

            {step === 1 && (
              <div className="space-y-5">
                {cart.length === 0 ? (
                  <div className="text-center py-10 space-y-4">
                    <div className="text-4xl text-slate-300">
                      <i className="fa-solid fa-suitcase-rolling"></i>
                    </div>
                    <p className="text-slate-600 font-bold">سلة الحجز فارغة حالياً.</p>
                    <button
                      type="button"
                      onClick={onBackHome}
                      className="bg-terracotta hover:bg-terracottaDark text-white font-bold px-5 py-2.5 rounded-xl text-sm"
                    >
                      استعراض التجارب المتاحة
                    </button>
                  </div>
                ) : (
                  <>
                    <div className="space-y-3">
                      {cart.map((item) => (
                        <div
                          key={item.id}
                          className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 p-4 rounded-2xl bg-sand border border-slate-200/80"
                        >
                          <div className="space-y-1">
                            <div className="font-extrabold text-atlanticDark">{item.title}</div>
                            <div className="text-xs text-slate-600">
                              الوجهة: {item.location} • التاريخ: {item.date} • السعر: ${item.unitPrice}/شخص
                            </div>
                            {item.notes && (
                              <div className="text-xs text-terracottaDark font-semibold">ملاحظة: {item.notes}</div>
                            )}
                          </div>

                          <div className="flex items-center justify-between sm:justify-end gap-3">
                            <div className="flex items-center border border-slate-300 bg-white rounded-xl overflow-hidden">
                              <button
                                type="button"
                                onClick={() => onUpdateQuantity(item.id, item.quantity - 1)}
                                className="px-3 py-1.5 font-extrabold hover:bg-slate-100"
                              >
                                -
                              </button>
                              <span className="px-3 font-extrabold text-sm">{item.quantity}</span>
                              <button
                                type="button"
                                onClick={() => onUpdateQuantity(item.id, item.quantity + 1)}
                                className="px-3 py-1.5 font-extrabold hover:bg-slate-100"
                              >
                                +
                              </button>
                            </div>

                            <div className="font-extrabold text-atlanticDark min-w-[65px] text-left">
                              ${item.unitPrice * item.quantity}
                            </div>

                            <button
                              type="button"
                              onClick={() => onRemoveItem(item.id)}
                              className="text-red-600 hover:bg-red-50 p-2 rounded-lg transition"
                              title="حذف"
                            >
                              <i className="fa-solid fa-trash"></i>
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>

                    <div className="flex items-center justify-between border-t pt-4">
                      <span className="font-bold text-slate-700">المجموع الإجمالي:</span>
                      <span className="text-2xl font-extrabold text-terracottaDark">${subtotal}</span>
                    </div>

                    <div className="flex justify-end">
                      <button
                        type="button"
                        onClick={() => setStep(2)}
                        className="bg-atlanticDark hover:bg-atlantic text-white font-bold px-6 py-3 rounded-xl text-sm transition inline-flex items-center gap-2"
                      >
                        متابعة إلى بيانات المسافر
                        <i className="fa-solid fa-arrow-left"></i>
                      </button>
                    </div>
                  </>
                )}
              </div>
            )}

            {step === 2 && (
              <div className="space-y-4">
                <div className="grid sm:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1.5">الاسم الكامل *</label>
                    <input
                      type="text"
                      value={customer.fullName}
                      onChange={(e) => setCustomer({ ...customer, fullName: e.target.value })}
                      placeholder="مثال: Claire Laurent"
                      className="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-terracotta"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1.5">رقم الهاتف / WhatsApp *</label>
                    <input
                      type="tel"
                      value={customer.phone}
                      onChange={(e) => setCustomer({ ...customer, phone: e.target.value })}
                      placeholder="مثال: +33 6 12 34 56 78"
                      className="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-terracotta"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1.5">البريد الإلكتروني</label>
                    <input
                      type="email"
                      value={customer.email}
                      onChange={(e) => setCustomer({ ...customer, email: e.target.value })}
                      placeholder="name@example.com"
                      className="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-terracotta"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1.5">السوق / المنطقة</label>
                    <select
                      value={customer.nationality}
                      onChange={(e) => setCustomer({ ...customer, nationality: e.target.value })}
                      className="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm bg-white focus:outline-none focus:border-terracotta"
                    >
                      <option value="France / Europe">فرنسا / أوروبا</option>
                      <option value="Gulf / UAE / KSA">الخليج / الإمارات / السعودية</option>
                      <option value="UK / North America">بريطانيا / أمريكا الشمالية</option>
                      <option value="Other International">وجهة دولية أخرى</option>
                    </select>
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1.5">مدينة أو مكان الانطلاق</label>
                  <input
                    type="text"
                    value={customer.pickupCity}
                    onChange={(e) => setCustomer({ ...customer, pickupCity: e.target.value })}
                    placeholder="مثال: Rabat, Sale, Temara, Marrakech"
                    className="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-terracotta"
                  />
                </div>

                <div className="flex items-center justify-between pt-4 border-t">
                  <button
                    type="button"
                    onClick={() => setStep(1)}
                    className="bg-slate-100 hover:bg-slate-200 text-atlanticDark font-bold px-5 py-2.5 rounded-xl text-sm"
                  >
                    رجوع للسلة
                  </button>
                  <button
                    type="button"
                    disabled={submitting}
                    onClick={handleSendToTelegram}
                    className="bg-terracotta hover:bg-terracottaDark disabled:opacity-60 text-white font-bold px-6 py-3 rounded-xl text-sm transition inline-flex items-center gap-2"
                  >
                    <i className="fa-brands fa-telegram text-base"></i>
                    {submitting ? 'جاري الإرسال...' : 'تأكيد وإرسال الطلب عبر Telegram'}
                  </button>
                </div>
              </div>
            )}

            {step === 3 && orderSuccess && (
              <div className="text-center py-6 space-y-5">
                <div className="w-16 h-16 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center text-3xl mx-auto">
                  <i className="fa-solid fa-check"></i>
                </div>
                <h2 className="text-2xl font-extrabold text-atlanticDark">تم تسجيل طلب الحجز بنجاح</h2>
                <p className="text-sm text-slate-600 max-w-lg mx-auto">
                  {orderSuccess.demoMode
                    ? 'تم تجهيز نص الطلب بنجاح. أضف botToken و chatId الحقيقيين داخل TELEGRAM_CONFIG باش يوصل الطلب مباشرة لبوت تيليغرام.'
                    : 'تم إرسال تفاصيل الحجز مباشرة إلى بوت تيليغرام وسيتم التواصل معك لتأكيد الموعد.'}
                </p>

                <pre className="text-right bg-slate-900 text-emerald-300 text-xs p-4 rounded-2xl overflow-x-auto max-w-xl mx-auto leading-relaxed" dir="ltr">
                  {orderSuccess.preview}
                </pre>

                <button
                  type="button"
                  onClick={() => {
                    setOrderSuccess(null);
                    setStep(1);
                    onBackHome();
                  }}
                  className="bg-atlanticDark hover:bg-atlantic text-white font-bold px-6 py-3 rounded-xl text-sm"
                >
                  العودة إلى الصفحة الرئيسية
                </button>
              </div>
            )}
          </div>
        </section>
      );
    }

    function App() {
      const [currentView, setCurrentView] = useState('home');
      const [selectedExperience, setSelectedExperience] = useState(null);
      const [cart, setCart] = useState([
        {
          id: 'rabat-sale-heritage-2026-12-10',
          experienceId: 'rabat-sale-heritage',
          title: 'جولة الرباط وسلا الخاصة (تراث، قصبة الأوداية، وثقافة محلية)',
          location: 'الرباط • سلا',
          unitPrice: 65,
          quantity: 2,
          date: '2026-12-10',
          notes: 'جولة صباحية باللغة الإنجليزية',
        },
      ]);

      const cartCount = useMemo(
        () => cart.reduce((acc, item) => acc + item.quantity, 0),
        [cart]
      );

      const handleSelectExperience = (exp) => {
        setSelectedExperience(exp);
        setCurrentView('details');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleAddToCart = (newItem) => {
        setCart((prev) => {
          const existingIndex = prev.findIndex((item) => item.id === newItem.id);
          if (existingIndex > -1) {
            const copy = [...prev];
            copy[existingIndex] = {
              ...copy[existingIndex],
              quantity: copy[existingIndex].quantity + newItem.quantity,
              notes: newItem.notes || copy[existingIndex].notes,
            };
            return copy;
          }
          return [...prev, newItem];
        });
      };

      const handleQuickAdd = (exp) => {
        handleAddToCart({
          id: `${exp.id}-2026-12-15`,
          experienceId: exp.id,
          title: exp.title,
          location: exp.location,
          unitPrice: exp.pricePerPerson,
          quantity: 1,
          date: '2026-12-15',
          notes: '',
        });
      };

      const handleUpdateQuantity = (id, nextQty) => {
        if (nextQty <= 0) {
          setCart((prev) => prev.filter((item) => item.id !== id));
          return;
        }
        setCart((prev) =>
          prev.map((item) => (item.id === id ? { ...item, quantity: nextQty } : item))
        );
      };

      const handleRemoveItem = (id) => {
        setCart((prev) => prev.filter((item) => item.id !== id));
      };

      const handleClearCart = () => {
        setCart([]);
      };

      return (
        <div className="min-h-screen flex flex-col justify-between">
          <div>
            <Navbar
              currentView={currentView}
              setCurrentView={(view) => {
                setCurrentView(view);
                window.scrollTo({ top: 0, behavior: 'smooth' });
              }}
              cartCount={cartCount}
            />

            {currentView === 'home' && (
              <HomeView
                experiences={EXPERIENCES}
                onSelectExperience={handleSelectExperience}
                onQuickAdd={handleQuickAdd}
              />
            )}

            {currentView === 'details' && (
              <ProductDetailsView
                experience={selectedExperience}
                onBack={() => setCurrentView('home')}
                onAddToCart={handleAddToCart}
                onGoCheckout={() => setCurrentView('checkout')}
              />
            )}

            {currentView === 'checkout' && (
              <CheckoutFlow
                cart={cart}
                onUpdateQuantity={handleUpdateQuantity}
                onRemoveItem={handleRemoveItem}
                onClearCart={handleClearCart}
                onBackHome={() => setCurrentView('home')}
              />
            )}
          </div>

          <footer className="bg-atlanticDark text-white/80 py-6 px-4 mt-12 border-t border-white/10">
            <div className="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3 text-xs">
              <div>Atlas Escapes Morocco • جولات وتجارب خاصة في الرباط، سلا، تمارة، ومراكش</div>
              <div className="text-amber-200/90">حجز مباشر • استجابة سريعة للزوار الأجانب</div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
