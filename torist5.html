                  setVisibleCount(PAGE_SIZE);
                }}
                placeholder={UI_TEXT.searchPlaceholder}
                className="flex-1 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-ochre"
              />
              <div className="flex flex-wrap gap-2">
                {categories.map((cat) => (
                  <button
                    key={cat.key}
                    type="button"
                    onClick={() => {
                      setSelectedCat(cat.key);
                      setVisibleCount(PAGE_SIZE);
                    }}
                    className={`px-3.5 py-2 rounded-xl text-xs font-bold border transition ${
                      selectedCat === cat.key
                        ? 'bg-ink text-white border-ink'
                        : 'bg-paper text-ink border-slate-200 hover:border-ochre'
                    }`}
                  >
                    {cat.label}
                  </button>
                ))}
              </div>
            </div>
          </section>

          <section className="space-y-8">
            <div className="flex items-center justify-between text-xs sm:text-sm font-bold text-slate-600 px-1">
              <div>
                {UI_TEXT.showingCount}{' '}
                <span className="text-ink font-extrabold">{visibleArticles.length}</span>{' '}
                {UI_TEXT.ofCount}{' '}
                <span className="text-ink font-extrabold">{filtered.length}</span>{' '}
                {UI_TEXT.articlesWord}
              </div>
            </div>

            <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
              {visibleArticles.map((article) => (
                <article
                  key={article.id}
                  className="bg-white rounded-2xl overflow-hidden border border-slate-200/80 shadow-sm hover:shadow-lg transition flex flex-col justify-between"
                >
                  <div>
                    <img src={article.image} alt={article.title} className="w-full h-48 object-cover" />
                    <div className="p-5 space-y-3">
                      <div className="flex items-center justify-between text-xs text-slate-500 font-bold">
                        <span className="text-ochreDark">{catLabelMap[article.categoryKey]}</span>
                        <span>{article.readTime}</span>
                      </div>
                      <h2 className="text-lg font-extrabold text-ink leading-snug">
                        {article.title}
                      </h2>
                      <p className="text-sm text-slate-600 leading-relaxed">
                        {article.excerpt}
                      </p>
                    </div>
                  </div>
                  <div className="px-5 pb-5">
                    <button
                      type="button"
                      onClick={() => onOpenArticle(article)}
                      className="w-full bg-ink hover:bg-ochre text-white font-bold py-2.5 px-4 rounded-xl text-sm transition"
                    >
                      {UI_TEXT.readMore}
                    </button>
                  </div>
                </article>
              ))}
            </div>

            {remainingCount > 0 && (
              <div className="flex justify-center pt-2">
                <button
                  type="button"
                  onClick={() => setVisibleCount((prev) => prev + PAGE_SIZE)}
                  className="bg-ochre hover:bg-ochreDark text-white font-extrabold px-8 py-3.5 rounded-2xl text-sm sm:text-base shadow-md transition inline-flex items-center gap-2.5"
                >
                  <i className="fa-solid fa-layer-group"></i>
                  <span>{UI_TEXT.loadMore}</span>
                  <span className="bg-white/20 text-white text-xs px-2.5 py-0.5 rounded-full">
                    +{Math.min(PAGE_SIZE, remainingCount)}
                  </span>
                </button>
              </div>
            )}
          </section>
        </main>
      );
    }

    function ArticleDetailView({ article, onBack }) {
      if (!article) return null;

      const catLabelMap = {
        heritage: UI_TEXT.catHeritage,
        surf: UI_TEXT.catSurf,
        itinerary: UI_TEXT.catItinerary,
        transport: UI_TEXT.catTransport,
      };

      return (
        <main className="max-w-4xl mx-auto px-4 py-10">
          <button
            type="button"
            onClick={onBack}
            className="mb-6 inline-flex items-center gap-2 text-sm font-bold text-ink hover:text-ochre"
          >
            <i className="fa-solid fa-arrow-left"></i>
            {UI_TEXT.backToList}
          </button>

          <article className="bg-white rounded-3xl overflow-hidden border border-slate-200/80 shadow-sm">
            <img src={article.image} alt={article.title} className="w-full h-72 object-cover" />
            <div className="p-6 sm:p-10 space-y-6">
              <div className="flex flex-wrap items-center gap-3 text-xs font-bold text-slate-500">
                <span className="bg-amber-100 text-ochreDark px-3 py-1 rounded-full">
                  {catLabelMap[article.categoryKey]}
                </span>
                <span>{UI_TEXT.publishedOn} {article.date}</span>
                <span>• {article.readTime}</span>
              </div>

              <h1 className="text-2xl sm:text-3xl font-extrabold text-ink leading-snug">{article.title}</h1>
              <p className="text-base text-slate-700 leading-relaxed border-l-4 border-ochre pl-4">{article.excerpt}</p>

              <div className="space-y-6 pt-2">
                {article.sections.map((sec, idx) => (
                  <section key={idx} className="space-y-2">
                    <h2 className="text-xl font-extrabold text-ink">{sec.heading}</h2>
                    {sec.body.split('\n\n').map((para, pIdx) => (
                      <p key={pIdx} className="text-slate-700 leading-8 text-sm sm:text-base">
                        {para}
                      </p>
                    ))}
                  </section>
                ))}
              </div>
            </div>
          </article>
        </main>
      );
    }

    function StaticLegalPage({ page }) {
      const [sent, setSent] = useState(false);

      if (page === 'about') {
        return (
          <main className="max-w-4xl mx-auto px-4 py-10">
            <div className="bg-white rounded-3xl p-8 border border-slate-200 space-y-4 leading-8">
              <h1 className="text-2xl font-extrabold text-ink">{UI_TEXT.aboutTitle}</h1>
              <p>{UI_TEXT.aboutP1}</p>
              <p>{UI_TEXT.aboutP2}</p>
            </div>
          </main>
        );
      }

      if (page === 'contact') {
        return (
          <main className="max-w-4xl mx-auto px-4 py-10">
            <div className="bg-white rounded-3xl p-8 border border-slate-200 space-y-6">
              <div>
                <h1 className="text-2xl font-extrabold text-ink">{UI_TEXT.contactTitle}</h1>
                <p className="text-sm text-slate-600 mt-1">
                  {UI_TEXT.contactDesc}
                  <span className="font-bold text-ochreDark mx-1">contact@yourdomain.com</span>
                </p>
              </div>

              {sent ? (
                <div className="bg-emerald-50 border border-emerald-200 text-emerald-800 p-4 rounded-xl text-sm font-bold">
                  {UI_TEXT.contactSent}
                </div>
              ) : (
                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    setSent(true);
                  }}
                  className="space-y-4"
                >
                  <input required type="text" placeholder={UI_TEXT.formName} className="w-full border border-slate-300 rounded-xl px-4 py-2.5 text-sm" />
                  <input required type="email" placeholder={UI_TEXT.formEmail} className="w-full border border-slate-300 rounded-xl px-4 py-2.5 text-sm" />
                  <textarea required rows="4" placeholder={UI_TEXT.formMsg} className="w-full border border-slate-300 rounded-xl px-4 py-2.5 text-sm"></textarea>
                  <button type="submit" className="bg-ochre hover:bg-ochreDark text-white font-bold px-6 py-2.5 rounded-xl text-sm">
                    {UI_TEXT.formBtn}
                  </button>
                </form>
              )}
            </div>
          </main>
        );
      }

      if (page === 'privacy') {
        return (
          <main className="max-w-4xl mx-auto px-4 py-10">
            <div className="bg-white rounded-3xl p-8 border border-slate-200 space-y-4 leading-8 text-sm sm:text-base">
              <h1 className="text-2xl font-extrabold text-ink">{UI_TEXT.privacyTitle}</h1>
              <p>{UI_TEXT.privacyP1}</p>
              <h2 className="text-lg font-extrabold text-ink">{UI_TEXT.privacyH2}</h2>
              <p>{UI_TEXT.privacyP2}</p>
              <p>{UI_TEXT.privacyP3}</p>
            </div>
          </main>
        );
      }

      return (
        <main className="max-w-4xl mx-auto px-4 py-10">
          <div className="bg-white rounded-3xl p-8 border border-slate-200 space-y-4 leading-8 text-sm sm:text-base">
            <h1 className="text-2xl font-extrabold text-ink">{UI_TEXT.termsTitle}</h1>
            <p>{UI_TEXT.termsP1}</p>
            <p>{UI_TEXT.termsP2}</p>
          </div>
        </main>
      );
    }

    function App() {
      const [page, setPage] = useState('home');
      const [activeArticle, setActiveArticle] = useState(null);

      const openArticle = (article) => {
        setActiveArticle(article);
        setPage('article');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      return (
        <div className="min-h-screen flex flex-col justify-between">
          <div>
            <Header page={page} setPage={setPage} />
            {page === 'home' && <HomeArticlesView onOpenArticle={openArticle} />}
            {page === 'article' && <ArticleDetailView article={activeArticle} onBack={() => setPage('home')} />}
            {['about', 'contact', 'privacy', 'terms'].includes(page) && <StaticLegalPage page={page} />}
          </div>

          <footer className="bg-ink text-white/85 py-8 px-4 mt-12 border-t border-white/10">
            <div className="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4 text-xs">
              <div>{UI_TEXT.footerRights}</div>
              <div className="flex flex-wrap items-center gap-4 font-bold">
                <button type="button" onClick={() => setPage('about')} className="hover:text-amber-300">{UI_TEXT.navAbout}</button>
                <button type="button" onClick={() => setPage('contact')} className="hover:text-amber-300">{UI_TEXT.navContact}</button>
                <button type="button" onClick={() => setPage('privacy')} className="hover:text-amber-300">{UI_TEXT.navPrivacy}</button>
                <button type="button" onClick={() => setPage('terms')} className="hover:text-amber-300">{UI_TEXT.navTerms}</button>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
