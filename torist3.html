              {t.heroTitle}
            </h1>
            <p className="text-slate-600 text-sm sm:text-base max-w-3xl leading-relaxed">
              {t.heroDesc}
            </p>
            <div className="bg-paper border border-amber-200/80 text-slate-700 text-xs sm:text-sm p-3.5 rounded-2xl">
              {t.langNote}
            </div>

            <div className="flex flex-col sm:flex-row gap-3 pt-2">
              <input
                type="text"
                value={query}
                onChange={(e) => setQuery(e.target.value)}
                placeholder={t.searchPlaceholder}
                className="flex-1 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-ochre"
              />
              <div className="flex flex-wrap gap-2">
                {categories.map((cat) => (
                  <button
                    key={cat.key}
                    type="button"
                    onClick={() => setSelectedCat(cat.key)}
                    className={`px-3.5 py-2 rounded-xl text-xs font-bold border transition ${
                      selectedCat === cat.key
                        ? 'bg-ink text-white border-ink'
                        : 'bg-paper text-ink border-slate-200 hover:border-ochre'
                    }`}
                  >
                    {cat.label}
                  </button>
                ))}
              </div>
            </div>
          </section>

          <section className="grid md:grid-cols-2 gap-6">
            {filtered.map((article) => (
              <article
                key={article.id}
                className="bg-white rounded-2xl overflow-hidden border border-slate-200/80 shadow-sm hover:shadow-lg transition flex flex-col justify-between"
              >
                <div>
                  <img src={article.image} alt={article.title} className="w-full h-52 object-cover" />
                  <div className="p-6 space-y-3">
                    <div className="flex items-center justify-between text-xs text-slate-500 font-bold">
                      <span className="text-ochreDark">{catLabelMap[article.categoryKey]}</span>
                      <span>{article.readTime}</span>
                    </div>
                    <h2 className="text-xl font-extrabold text-ink leading-snug" dir="ltr">
                      {article.title}
                    </h2>
                    <p className="text-sm text-slate-600 leading-relaxed" dir="ltr">
                      {article.excerpt}
                    </p>
                  </div>
                </div>
                <div className="px-6 pb-6">
                  <button
                    type="button"
                    onClick={() => onOpenArticle(article)}
                    className="w-full bg-ink hover:bg-ochre text-white font-bold py-2.5 px-4 rounded-xl text-sm transition"
                  >
                    {t.readMore}
                  </button>
                </div>
              </article>
            ))}
          </section>
        </main>
      );
    }

    function ArticleDetailView({ lang, article, onBack }) {
      if (!article) return null;
      const t = UI_TEXT[lang];
      const catLabelMap = {
        heritage: t.catHeritage,
        surf: t.catSurf,
        itinerary: t.catItinerary,
        transport: t.catTransport,
      };

      return (
        <main className="max-w-4xl mx-auto px-4 py-10">
          <button
            type="button"
            onClick={onBack}
            className="mb-6 inline-flex items-center gap-2 text-sm font-bold text-ink hover:text-ochre"
          >
            <i className={`fa-solid ${lang === 'ar' ? 'fa-arrow-right' : 'fa-arrow-left'}`}></i>
            {t.backToList}
          </button>

          <article className="bg-white rounded-3xl overflow-hidden border border-slate-200/80 shadow-sm" dir="ltr">
            <img src={article.image} alt={article.title} className="w-full h-72 object-cover" />
            <div className="p-6 sm:p-10 space-y-6">
              <div className="flex flex-wrap items-center gap-3 text-xs font-bold text-slate-500">
                <span className="bg-amber-100 text-ochreDark px-3 py-1 rounded-full">
                  {catLabelMap[article.categoryKey]}
                </span>
                <span>{t.publishedOn}: {article.date}</span>
                <span>• {article.readTime}</span>
              </div>

              <h1 className="text-2xl sm:text-3xl font-extrabold text-ink leading-snug">{article.title}</h1>
              <p className="text-base text-slate-700 leading-relaxed border-l-4 border-ochre pl-4">{article.excerpt}</p>

              <div className="space-y-6 pt-2">
                {article.sections.map((sec, idx) => (
                  <section key={idx} className="space-y-2">
                    <h2 className="text-xl font-extrabold text-ink">{sec.heading}</h2>
                    {sec.body.split('\n\n').map((para, pIdx) => (
                      <p key={pIdx} className="text-slate-700 leading-8 text-sm sm:text-base">
                        {para}
                      </p>
                    ))}
                  </section>
                ))}
              </div>
            </div>
          </article>
        </main>
      );
    }

    function StaticLegalPage({ lang, page }) {
      const t = UI_TEXT[lang];
      const [sent, setSent] = useState(false);

      if (page === 'about') {
        return (
          <main className="max-w-4xl mx-auto px-4 py-10">
            <div className="bg-white rounded-3xl p-8 border border-slate-200 space-y-4 leading-8">
              <h1 className="text-2xl font-extrabold text-ink">{t.aboutTitle}</h1>
              <p>{t.aboutP1}</p>
              <p>{t.aboutP2}</p>
            </div>
          </main>
        );
      }

      if (page === 'contact') {
        return (
          <main className="max-w-4xl mx-auto px-4 py-10">
            <div className="bg-white rounded-3xl p-8 border border-slate-200 space-y-6">
              <div>
                <h1 className="text-2xl font-extrabold text-ink">{t.contactTitle}</h1>
                <p className="text-sm text-slate-600 mt-1">
                  {t.contactDesc}
                  <span className="font-bold text-ochreDark mx-1" dir="ltr">contact@yourdomain.com</span>
                </p>
              </div>

              {sent ? (
                <div className="bg-emerald-50 border border-emerald-200 text-emerald-800 p-4 rounded-xl text-sm font-bold">
                  {t.contactSent}
                </div>
              ) : (
                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    setSent(true);
                  }}
                  className="space-y-4"
                >
                  <input required type="text" placeholder={t.formName} className="w-full border border-slate-300 rounded-xl px-4 py-2.5 text-sm" />
                  <input required type="email" placeholder={t.formEmail} className="w-full border border-slate-300 rounded-xl px-4 py-2.5 text-sm" />
                  <textarea required rows="4" placeholder={t.formMsg} className="w-full border border-slate-300 rounded-xl px-4 py-2.5 text-sm"></textarea>
                  <button type="submit" className="bg-ochre hover:bg-ochreDark text-white font-bold px-6 py-2.5 rounded-xl text-sm">
                    {t.formBtn}
                  </button>
                </form>
              )}
            </div>
          </main>
        );
      }

      if (page === 'privacy') {
        return (
          <main className="max-w-4xl mx-auto px-4 py-10">
            <div className="bg-white rounded-3xl p-8 border border-slate-200 space-y-4 leading-8 text-sm sm:text-base">
              <h1 className="text-2xl font-extrabold text-ink">{t.privacyTitle}</h1>
              <p>{t.privacyP1}</p>
              <h2 className="text-lg font-extrabold text-ink">{t.privacyH2}</h2>
              <p>{t.privacyP2}</p>
              <p>{t.privacyP3}</p>
            </div>
          </main>
        );
      }

      return (
        <main className="max-w-4xl mx-auto px-4 py-10">
          <div className="bg-white rounded-3xl p-8 border border-slate-200 space-y-4 leading-8 text-sm sm:text-base">
            <h1 className="text-2xl font-extrabold text-ink">{t.termsTitle}</h1>
            <p>{t.termsP1}</p>
            <p>{t.termsP2}</p>
          </div>
        </main>
      );
    }

    function App() {
      const [lang, setLang] = useState('ar');
      const [page, setPage] = useState('home');
      const [activeArticle, setActiveArticle] = useState(null);
      const t = UI_TEXT[lang];

      useEffect(() => {
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      }, [lang]);

      const openArticle = (article) => {
        setActiveArticle(article);
        setPage('article');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      return (
        <div className="min-h-screen flex flex-col justify-between">
          <div>
            <Header lang={lang} setLang={setLang} page={page} setPage={setPage} />
            {page === 'home' && <HomeArticlesView lang={lang} onOpenArticle={openArticle} />}
            {page === 'article' && <ArticleDetailView lang={lang} article={activeArticle} onBack={() => setPage('home')} />}
            {['about', 'contact', 'privacy', 'terms'].includes(page) && <StaticLegalPage lang={lang} page={page} />}
          </div>

          <footer className="bg-ink text-white/85 py-8 px-4 mt-12 border-t border-white/10">
            <div className="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4 text-xs">
              <div>{t.footerRights}</div>
              <div className="flex flex-wrap items-center gap-4 font-bold">
                <button type="button" onClick={() => setPage('about')} className="hover:text-amber-300">{t.navAbout}</button>
                <button type="button" onClick={() => setPage('contact')} className="hover:text-amber-300">{t.navContact}</button>
                <button type="button" onClick={() => setPage('privacy')} className="hover:text-amber-300">{t.navPrivacy}</button>
                <button type="button" onClick={() => setPage('terms')} className="hover:text-amber-300">{t.navTerms}</button>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
