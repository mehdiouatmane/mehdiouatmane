                            );
                        })}
                    </div>

                    {/* منطقة العرض التجريبية (جاهزة لربط مشغل الفيديو) */}
                    <div className="relative h-64 md:h-80 flex flex-col items-center justify-center text-center px-4 bg-gradient-to-b from-slate-900 to-black">
                        <div className="w-16 h-16 rounded-full bg-white/15 hover:bg-white/25 text-white flex items-center justify-center text-2xl mb-3 transition cursor-pointer">
                            <i className="fa-solid fa-play mr-0.5"></i>
                        </div>
                        <div className="text-white font-extrabold text-base">
                            {match.homeTeam} vs {match.awayTeam}
                        </div>
                        <div className="text-xs text-gray-300 mt-1">
                            المشغل النشط: <span className="font-bold text-amber-400">{currentServerObj?.label}</span> | القناة: <span dir="ltr">{match.channel}</span>
                        </div>
                        <div className="mt-3 text-[11px] text-gray-400 max-w-md bg-white/5 px-3 py-1.5 rounded">
                            منطقة مشغل الفيديو — اربط رابط التضمين أو البث الخاص بك داخل هذا المكون
                        </div>
                    </div>
                </section>

                {/* تنبيه أسفل المشغل */}
                <div className="bg-[#8b140d] text-white text-center p-4 rounded-md font-bold text-sm leading-7 shadow">
                    تنبيه : إذا توقف البث قم بالضغط علي تحديث أو اختار مشغل آخر من أعلى الشاشة لمشاهدة البث المباشر وسوف يتم تحديث البث أول بأول
                </div>

                {/* فقرة إضافية + خلاصة */}
                <section className="bg-[#f4f5f7] dark:bg-slateui-800 rounded-md p-5 shadow-sm border border-gray-200 dark:border-slateui-700 text-center space-y-4">
                    <div className="bg-[#e5e7eb] dark:bg-slateui-700 rounded-md p-3.5 font-extrabold text-gray-900 dark:text-white text-base">
                        لماذا يفضل الجمهور متابعة {match.channel}
                    </div>
                    <p className="text-gray-800 dark:text-gray-200 leading-8 text-sm md:text-base font-medium">
                        {match.whyWatch}
                    </p>

                    <div className="bg-[#e5e7eb] dark:bg-slateui-700 rounded-md p-3.5 font-extrabold text-gray-900 dark:text-white text-base">
                        خلاصة مشاهدة مباراة {match.homeTeam} و {match.awayTeam}
                    </div>
                    <p className="text-gray-800 dark:text-gray-200 leading-8 text-sm md:text-base font-medium">
                        {match.conclusion}
                    </p>
                </section>

                {/* أزرار المشاركة */}
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5 pt-1">
                    <a
                        href={`https://t.me/share/url?url=${encodeURIComponent(shareUrl)}&text=${encodeURIComponent(shareText)}`}
                        target="_blank"
                        rel="noreferrer"
                        className="bg-[#56a8dc] hover:bg-[#4395c9] text-white py-2.5 rounded font-bold text-sm text-center shadow transition"
                    >
                        telegram
                    </a>
                    <a
                        href={`https://api.whatsapp.com/send?text=${encodeURIComponent(shareText + ' ' + shareUrl)}`}
                        target="_blank"
                        rel="noreferrer"
                        className="bg-[#64a84c] hover:bg-[#53943c] text-white py-2.5 rounded font-bold text-sm text-center shadow transition"
                    >
                        whatsapp
                    </a>
                    <a
                        href={`https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}&url=${encodeURIComponent(shareUrl)}`}
                        target="_blank"
                        rel="noreferrer"
                        className="bg-[#5ca9e6] hover:bg-[#4996d4] text-white py-2.5 rounded font-bold text-sm text-center shadow transition"
                    >
                        twitter
                    </a>
                    <a
                        href={`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(shareUrl)}`}
                        target="_blank"
                        rel="noreferrer"
                        className="bg-[#48679c] hover:bg-[#3b5685] text-white py-2.5 rounded font-bold text-sm text-center shadow transition"
                    >
                        facebook
                    </a>
                </div>
            </main>
        );
    };

    // ================== 7. نافذة إرسال بلاغ/طلب إلى تيليجرام ==================
    const TelegramReportModal = ({ isOpen, onClose, initialMatch, onToast }) => {
        const [senderName, setSenderName] = React.useState('');
        const [noteType, setNoteType] = React.useState('بلاغ عن توقف البث');
        const [messageText, setMessageText] = React.useState('');
        const [sending, setSending] = React.useState(false);

        React.useEffect(() => {
            if (initialMatch) {
                setMessageText(`بخصوص مباراة: ${initialMatch.homeTeam} ضد ${initialMatch.awayTeam} (${initialMatch.channel})`);
            } else {
                setMessageText('');
            }
        }, [initialMatch, isOpen]);

        if (!isOpen) return null;

        const handleSubmit = async (e) => {
            e.preventDefault();
            setSending(true);

            const telegramMsg = [
                '⚽ *رسالة جديدة من Koora Live*',
                `📌 *النوع:* ${noteType}`,
                senderName ? `👤 *المرسل:* ${senderName}` : null,
                `📝 *التفاصيل:* ${messageText}`
            ].filter(Boolean).join('\n');

            try {
                const res = await fetch(`https://api.telegram.org/bot${TELEGRAM_CONFIG.token}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CONFIG.chatId,
                        text: telegramMsg,
                        parse_mode: 'Markdown'
                    })
                });

                if (res.ok) {
                    onToast('تم إرسال رسالتك إلى تيليجرام بنجاح');
                    setSenderName('');
                    setMessageText('');
                    onClose();
                } else {
                    onToast('تعذر الإرسال، تحقق من إعدادات البوت');
                }
            } catch (err) {
                onToast('حدث خطأ في الاتصال بالشبكة');
            } finally {
                setSending(false);
            }
        };

        return (
            <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
                <div className="bg-white dark:bg-slateui-800 w-full max-w-md rounded-xl p-5 shadow-xl border border-gray-200 dark:border-slateui-700">
                    <div className="flex items-center justify-between border-b border-gray-200 dark:border-slateui-700 pb-3 mb-4">
                        <h3 className="font-extrabold text-gray-900 dark:text-white text-base flex items-center gap-2">
                            <i className="fa-brands fa-telegram text-sky-500 text-xl"></i>
                            <span>إرسال بلاغ أو طلب إلى تيليجرام</span>
                        </h3>
                        <button onClick={onClose} className="text-gray-400 hover:text-gray-700 dark:hover:text-white">
                            <i className="fa-solid fa-xmark text-lg"></i>
                        </button>
                    </div>

                    <form onSubmit={handleSubmit} className="space-y-3.5">
                        <div>
                            <label className="block text-xs font-bold text-gray-600 dark:text-gray-300 mb-1">نوع الرسالة</label>
                            <select
                                value={noteType}
                                onChange={(e) => setNoteType(e.target.value)}
                                className="w-full rounded-lg border border-gray-300 dark:border-slateui-600 bg-gray-50 dark:bg-slateui-900 text-gray-900 dark:text-white p-2.5 text-sm outline-none focus:border-crimson-700"
                            >
                                <option>بلاغ عن توقف البث</option>
                                <option>طلب إضافة مباراة أو قناة</option>
                                <option>ملاحظة عامة</option>
                            </select>
                        </div>

                        <div>
                            <label className="block text-xs font-bold text-gray-600 dark:text-gray-300 mb-1">الاسم (اختياري)</label>
                            <input
                                type="text"
                                value={senderName}
                                onChange={(e) => setSenderName(e.target.value)}
                                placeholder="اكتب اسمك أو كنيتك"
                                className="w-full rounded-lg border border-gray-300 dark:border-slateui-600 bg-gray-50 dark:bg-slateui-900 text-gray-900 dark:text-white p-2.5 text-sm outline-none focus:border-crimson-700"
                            />
                        </div>

                        <div>
                            <label className="block text-xs font-bold text-gray-600 dark:text-gray-300 mb-1">تفاصيل الطلب أو البلاغ</label>
                            <textarea
                                required
                                rows="3"
                                value={messageText}
                                onChange={(e) => setMessageText(e.target.value)}
                                placeholder="اكتب اسم المباراة أو القناة أو المشكلة..."
                                className="w-full rounded-lg border border-gray-300 dark:border-slateui-600 bg-gray-50 dark:bg-slateui-900 text-gray-900 dark:text-white p-2.5 text-sm outline-none focus:border-crimson-700"
                            ></textarea>
                        </div>

                        <div className="flex gap-2 pt-2">
                            <button
                                type="button"
                                onClick={onClose}
                                className="flex-1 py-2.5 rounded-lg bg-gray-200 dark:bg-slateui-700 text-gray-800 dark:text-gray-200 font-bold text-sm"
                            >
                                إلغاء
                            </button>
                            <button
                                type="submit"
                                disabled={sending}
                                className="flex-[2] py-2.5 rounded-lg bg-crimson-700 hover:bg-crimson-800 text-white font-extrabold text-sm flex items-center justify-center gap-2 disabled:opacity-60"
                            >
                                {sending ? <i className="fa-solid fa-spinner fa-spin"></i> : <i className="fa-solid fa-paper-plane"></i>}
                                <span>{sending ? 'جاري الإرسال...' : 'إرسال الآن'}</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        );
    };

    // ================== 8. الفوتر السفلي ==================
    const FooterBar = ({ onGoHome, onOpenReport }) => (
        <footer className="w-full bg-white dark:bg-slateui-900 border-t border-gray-200 dark:border-slateui-800 py-4 px-4 mt-8">
            <div className="max-w-2xl mx-auto flex items-center justify-between text-xs md:text-sm font-bold text-gray-800 dark:text-gray-300">
                <button onClick={onGoHome} className="hover:text-crimson-700 transition">
                    koora live
                </button>
                <button onClick={() => onOpenReport(null)} className="hover:text-crimson-700 transition">
                    تواصل عبر تيليجرام
                </button>
            </div>
        </footer>
    );

    // ================== 9. التطبيق الرئيسي ==================
    function App() {
        const [view, setView] = React.useState('home'); // 'home' | 'watch'
        const [activeTab, setActiveTab] = React.useState('today');
        const [selectedMatch, setSelectedMatch] = React.useState(null);
        const [darkMode, setDarkMode] = React.useState(false);
        const [timezone, setTimezone] = React.useState('بتوقيت الرياض');
        const [drawerOpen, setDrawerOpen] = React.useState(false);
        const [reportModal, setReportModal] = React.useState({ open: false, match: null });
        const [toast, setToast] = React.useState(null);

        React.useEffect(() => {
            const root = document.documentElement;
            if (darkMode) root.classList.add('dark');
            else root.classList.remove('dark');
        }, [darkMode]);

        const showToast = (msg) => {
            setToast(msg);
            setTimeout(() => setToast(null), 2500);
        };

        const handleSelectMatch = (match) => {
            setSelectedMatch(match);
            setView('watch');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        const handleGoHome = () => {
            setView('home');
            setDrawerOpen(false);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        return (
            <div className="min-h-screen flex flex-col justify-between text-right" dir="rtl">
                <div>
                    <TopHeader
                        darkMode={darkMode}
                        onToggleDark={() => setDarkMode(d => !d)}
                        onGoHome={handleGoHome}
                        onOpenDrawer={() => setDrawerOpen(true)}
                        onOpenReport={() => setReportModal({ open: true, match: selectedMatch })}
                    />

                    {view === 'home' && (
                        <TimezoneBar timezone={timezone} setTimezone={setTimezone} />
                    )}

                    {view === 'home' ? (
                        <MatchesHomeView
                            matches={matchesDB}
                            activeTab={activeTab}
                            setActiveTab={setActiveTab}
                            onSelectMatch={handleSelectMatch}
                            timezone={timezone}
                        />
                    ) : (
                        selectedMatch && (
                            <MatchWatchView
                                match={selectedMatch}
                                onBack={handleGoHome}
                                onOpenReport={(m) => setReportModal({ open: true, match: m })}
                                onToast={showToast}
                            />
                        )
                    )}
                </div>

                <FooterBar
                    onGoHome={handleGoHome}
                    onOpenReport={(m) => setReportModal({ open: true, match: m })}
                />

                {/* القائمة الجانبية البسيطة */}
                {drawerOpen && (
                    <div className="fixed inset-0 z-50 bg-black/50 flex justify-end" onClick={() => setDrawerOpen(false)}>
                        <div
                            className="w-64 bg-white dark:bg-slateui-900 h-full p-5 shadow-xl space-y-3"
                            onClick={(e) => e.stopPropagation()}
                        >
                            <div className="flex items-center justify-between border-b border-gray-200 dark:border-slateui-800 pb-3">
                                <span className="font-black text-crimson-700 dark:text-red-400 text-lg">القائمة</span>
                                <button onClick={() => setDrawerOpen(false)} className="text-gray-500">
                                    <i className="fa-solid fa-xmark text-xl"></i>
                                </button>
                            </div>
                            <button
                                onClick={() => { setActiveTab('today'); handleGoHome(); }}
                                className="w-full text-right py-2.5 px-3 rounded-lg font-bold text-sm hover:bg-gray-100 dark:hover:bg-slateui-800 text-gray-800 dark:text-gray-200"
                            >
                                مباريات اليوم
                            </button>
                            <button
                                onClick={() => { setActiveTab('tomorrow'); handleGoHome(); }}
                                className="w-full text-right py-2.5 px-3 rounded-lg font-bold text-sm hover:bg-gray-100 dark:hover:bg-slateui-800 text-gray-800 dark:text-gray-200"
                            >
                                مباريات الغد
                            </button>
                            <button
                                onClick={() => { setActiveTab('yesterday'); handleGoHome(); }}
                                className="w-full text-right py-2.5 px-3 rounded-lg font-bold text-sm hover:bg-gray-100 dark:hover:bg-slateui-800 text-gray-800 dark:text-gray-200"
                            >
                                مباريات الأمس
                            </button>
                            <button
                                onClick={() => { setDrawerOpen(false); setReportModal({ open: true, match: selectedMatch }); }}
                                className="w-full text-right py-2.5 px-3 rounded-lg font-bold text-sm bg-crimson-700 text-white"
                            >
                                إرسال بلاغ / طلب لتيليجرام
                            </button>
                        </div>
                    </div>
                )}

                {/* نافذة إرسال البلاغات والطلبات عبر Telegram Bot API */}
                <TelegramReportModal
                    isOpen={reportModal.open}
                    onClose={() => setReportModal({ open: false, match: null })}
                    initialMatch={reportModal.match}
                    onToast={showToast}
                />

                {/* إشعار سريع */}
                {toast && (
                    <div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 bg-gray-900 text-white text-xs font-bold px-4 py-2.5 rounded-full shadow-lg">
                        {toast}
                    </div>
                )}
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>

</body>
</html>
