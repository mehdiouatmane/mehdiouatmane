<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>French Flow - Writing Mode 🚀</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel CDN -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen font-sans flex flex-col items-center justify-center p-4">

    <div id="root" class="w-full max-w-md"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // القصة اليومية والكلمات مع الحركات المتحركة GIFs
        const gameData = [
          // --- أفعال (Verbes) ---
          { id: 1, type: 'verbe', word: 'Aller', translation: 'ذهب / تحرك', gif: 'https://media.giphy.com/media/3o7TKSjRrfIPjeiByM/giphy.gif' },
          { id: 2, type: 'verbe', word: 'Venir', translation: 'أتى / جاء', gif: 'https://media.giphy.com/media/l0HlRnAWXxn0MhOBK/giphy.gif' },
          { id: 3, type: 'verbe', word: 'Sortir', translation: 'خرج', gif: 'https://media.giphy.com/media/1wXfgjjZgAWUn3YTXT/giphy.gif' },
          { id: 4, type: 'verbe', word: 'Entrer', translation: 'دخل', gif: 'https://media.giphy.com/media/xT5LMFZDsj0AKUDYTS/giphy.gif' },
          { id: 5, type: 'verbe', word: 'Ecrire', translation: 'كتب', gif: 'https://media.giphy.com/media/3oKIPnAiaMCws8nOsE/giphy.gif' },
          { id: 6, type: 'verbe', word: 'Lire', translation: 'قرأ', gif: 'https://media.giphy.com/media/xT5LMHxhOfscxPfIfm/giphy.gif' },
          { id: 7, type: 'verbe', word: 'Acheter', translation: 'اشترى', gif: 'https://media.giphy.com/media/3o85xu9y84A7HwTS1i/giphy.gif' },
          { id: 8, type: 'verbe', word: 'Payer', translation: 'دفع المال', gif: 'https://media.giphy.com/media/Lp71UWhqz6jXtf5aWZ/giphy.gif' },
          { id: 9, type: 'verbe', word: 'Travailler', translation: 'عمل / خدام', gif: 'https://media.giphy.com/media/3o7abKhOpu0NwenH3O/giphy.gif' },
          { id: 10, type: 'verbe', word: 'Tomber en panne', translation: 'عطب / طاح أونبان', gif: 'https://media.giphy.com/media/3o7rc0qU6m5UHmsuc8/giphy.gif' },
          { id: 11, type: 'verbe', word: 'Annoncer', translation: 'أعلن / صرح', gif: 'https://media.giphy.com/media/3ohc14lUEaeH5RvCLu/giphy.gif' },
          { id: 12, type: 'verbe', word: 'Signer', translation: 'وقع عقد', gif: 'https://media.giphy.com/media/26ufc8n6CYsVpuzoA/giphy.gif' },
          { id: 13, type: 'verbe', word: 'Faire grève', translation: 'قام بإضراب', gif: 'https://media.giphy.com/media/dXKiD8XysOuhFAJB1f/giphy.gif' },

          // --- أسماء (Noms) ---
          { id: 14, type: 'nom', word: 'Le gouvernement', translation: 'الحكومة', gif: 'https://media.giphy.com/media/l0HlQXlQ9nN7qze0M/giphy.gif' },
          { id: 15, type: 'nom', word: 'La police', translation: 'الشرطة', gif: 'https://media.giphy.com/media/8qABb3dgjun8PdNirg/giphy.gif' },
          { id: 16, type: 'nom', word: 'L\'entreprise', translation: 'الشركة / البزنس', gif: 'https://media.giphy.com/media/xT9IgzoKnwFNmISR5I/giphy.gif' },
          { id: 17, type: 'nom', word: 'Le contrat', translation: 'العقد', gif: 'https://media.giphy.com/media/3o7abKhOpu0NwenH3O/giphy.gif' },
          { id: 18, type: 'nom', word: 'La livraison', translation: 'التوصيل واللوجيستيك', gif: 'https://media.giphy.com/media/3o6Zt6ML6BklcajjsA/giphy.gif' },
          { id: 19, type: 'nom', word: 'Le colis', translation: 'الطرد / السلعة', gif: 'https://media.giphy.com/media/5GoVLqeAOo6PK/giphy.gif' },
          { id: 20, type: 'nom', word: 'La grève', translation: 'الإضراب', gif: 'https://media.giphy.com/media/d2W7eZX5z62ziqdi/giphy.gif' }
        ];

        function App() {
          const [filter, setFilter] = useState('all');
          const [questions, setQuestions] = useState([]);
          const [currentIndex, setCurrentIndex] = useState(0);
          const [score, setScore] = useState(0);
          const [inputVal, setInputVal] = useState('');
          const [feedback, setFeedback] = useState(null); // null, 'correct', 'wrong'
          const [gameOver, setGameOver] = useState(false);
          
          const inputRef = useRef(null);

          useEffect(() => {
            resetGame();
          }, [filter]);

          useEffect(() => {
            if (inputRef.current) inputRef.current.focus();
          }, [currentIndex, questions]);

          const resetGame = () => {
            let filtered = gameData;
            if (filter !== 'all') {
              filtered = gameData.filter(item => item.type === filter);
            }
            const shuffled = [...filtered].sort(() => Math.random() - 0.5);
            setQuestions(shuffled);
            setCurrentIndex(0);
            setScore(0);
            setInputVal('');
            setFeedback(null);
            setGameOver(false);
          };

          const handleCheck = (e) => {
            e.preventDefault();
            if (feedback !== null || !inputVal.trim()) return;

            const currentQ = questions[currentIndex];
            // تنظيف النص المقارنة (إزالة الحروف الكبيرة والمسافات الزائدة)
            const userClean = inputVal.trim().toLowerCase();
            const targetClean = currentQ.word.toLowerCase();

            if (userClean === targetClean) {
              setFeedback('correct');
              setScore(prev => prev + 1);
            } else {
              setFeedback('wrong');
            }

            setTimeout(() => {
              setFeedback(null);
              setInputVal('');
              if (currentIndex + 1 < questions.length) {
                setCurrentIndex(prev => prev + 1);
              } else {
                setGameOver(true);
              }
            }, 1800);
          };

          if (questions.length === 0) return null;
          const currentQ = questions[currentIndex];

          return (
            <div className="flex flex-col items-center justify-center w-full">
              <header className="mb-4 text-center">
                <h1 className="text-2xl font-extrabold text-indigo-400 mb-1">✍️ French Flow - Mode الكتابة</h1>
                <p className="text-slate-400 text-xs">شوف الحركة المتحركة وكتب الكلمة بالفرنسية بيدك!</p>
              </header>

              <div className="flex gap-2 mb-4 bg-slate-900 p-1.5 rounded-xl border border-slate-800">
                <button 
                  onClick={() => setFilter('all')} 
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${filter === 'all' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`}>
                  الكل (Tout)
                </button>
                <button 
                  onClick={() => setFilter('verbe')} 
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${filter === 'verbe' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`}>
                  الأفعال (Verbes)
                </button>
                <button 
                  onClick={() => setFilter('nom')} 
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${filter === 'nom' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`}>
                  الأسماء (Noms)
                </button>
              </div>

              {!gameOver ? (
                <div className="w-full bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-2xl relative">
                  <div className="flex justify-between items-center mb-3 text-xs font-bold text-slate-400">
                    <span>Question {currentIndex + 1} / {questions.length}</span>
                    <span className="text-indigo-400">Score: {score}</span>
                  </div>

                  {/* GIF Container */}
                  <div className="w-full h-44 bg-slate-950 border border-slate-800 rounded-xl overflow-hidden mb-4 flex items-center justify-center shadow-inner relative">
                    <img 
                      src={currentQ.gif} 
                      alt="Action GIF" 
                      className="w-full h-full object-cover opacity-90"
                    />
                    <span className="absolute bottom-2 right-2 bg-slate-900/85 px-2 py-0.5 rounded text-[10px] text-indigo-300 uppercase tracking-widest border border-slate-700">
                      {currentQ.type} - ({currentQ.translation})
                    </span>
                  </div>

                  {/* Form الكتابة */}
                  <form onSubmit={handleCheck} className="flex flex-col gap-3">
                    <input 
                      ref={inputRef}
                      type="text" 
                      value={inputVal}
                      onChange={(e) => setInputVal(e.target.value)}
                      disabled={feedback !== null}
                      placeholder="اكتب الكلمة بالفرنسية هنا..." 
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-center text-sm text-white focus:outline-none focus:border-indigo-500 transition"
                      autoComplete="off"
                    />
                    <button 
                      type="submit"
                      disabled={feedback !== null || !inputVal.trim()}
                      className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 font-bold rounded-xl text-xs text-white transition shadow-lg"
                    >
                      تأكيد الجواب ➔
                    </button>
                  </form>

                  {/* Feedback */}
                  {feedback && (
                    <div className={`mt-3 text-center py-2 rounded-lg text-xs font-bold animate-pulse ${feedback === 'correct' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-rose-950 text-rose-400 border border-rose-800'}`}>
                      {feedback === 'correct' ? `✨ صحيح! برافو عليك` : `❌ خطأ! الكلمة الصحيحة هي: ${currentQ.word}`}
                    </div>
                  )}
                </div>
              ) : (
                <div className="w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 text-center shadow-2xl">
                  <span className="text-5xl block mb-3">🏆</span>
                  <h2 className="text-xl font-bold text-white mb-2">إنجاز رائع يا سي مهدي!</h2>
                  <p className="text-slate-300 text-xs mb-5">
                    كتبتي جبتی <span className="text-indigo-400 font-bold text-base">{score}</span> من أصل <span className="font-bold">{questions.length}</span> صحيحة.
                  </p>
                  <button
                    onClick={resetGame}
                    className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-xl text-xs text-white transition shadow-lg"
                  >
                    عاود التحدي 🔄
                  </button>
                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
