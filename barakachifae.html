<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر بركة للشفاء - منتجات طبيعية ومكملات غذائية ملكية</title>
    
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel CDN -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts (Cairo & Tajawal) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #fcfbf7;
            color: #1c2d20;
        }
    </style>
</head>
<body class="selection:bg-emerald-600 selection:text-white">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // رقم الواتساب الذي ستصلك عليه الطلبات (قم بتغييره برقمك مع مفتاح الدولة بدون +)
        const WHATSAPP_NUMBER = "212600000000"; 

        // قائمة المنتجات
        const productsData = [
            {
                id: 1,
                name: "خليط الطاقة الصباحي الملكي 100% طبيعي",
                category: "خلطات طاقة وعضلات",
                price: 250,
                unit: "500 غرام",
                rating: 5,
                image: "https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?q=80&w=800&auto=format&fit=crop",
                badge: "الأكثر مبيعاً 🔥",
                description: "تركيبة فائقة للنشاط والتركيز وتقوية العضلات. يجمع بين قمح وشعير محمرين ومطحونين، نبق، خروب، تمر دوم، عسل ملكي، زبدة بلدية، زيت زيتون بكر، لوز، شوفان، فواكه جافة، بذور الشيا، حبوب اللقاح، غذاء ملكات النحل، زبدة الفول السوداني، التين وبذور القرع والكتان والبيستاش.",
                ingredients: [
                    "قمح وشعير محمرين ومطحونين", "نبق وخروب وتمر دوم", "عسل حر وعسل تمر", 
                    "زبدة بلدية وزيت زيتون", "حبوب اللقاح وغذاء ملكات النحل", "لوز، شوفان، بيستاش، كاوكاو", 
                    "بذور الشيا، الكتان، زرعة القرع والتين"
                ]
            },
            {
                id: 2,
                name: "عسل السدر الملكي الحر",
                category: "منتجات النحل",
                price: 320,
                unit: "1 كجم",
                rating: 5,
                image: "https://images.unsplash.com/photo-1587049352847-8122203f6a38?q=80&w=800&auto=format&fit=crop",
                badge: "طبيعي 100%",
                description: "عسل سدر جبيلي خالص، مقوي للمناعة ومثالي لزيادة النشاط البدني والذهني.",
                ingredients: ["عسل سدر طبيعي 100%"]
            },
            {
                id: 3,
                name: "مكمل الذكاء واليقظة الذهنية",
                category: "مكملات التركيز",
                price: 180,
                unit: "300 غرام",
                rating: 4.9,
                image: "https://images.unsplash.com/photo-1615485290382-441e4d049cb5?q=80&w=800&auto=format&fit=crop",
                badge: "صفاء ذهني",
                description: "مزيج مخصص لدعم الذاكرة، صفاء الذهن، وتقليل الإجهاد اليومي بفضل مكسرات وبذور غنية بالأوميغا 3 والجينسينغ الطبيعي.",
                ingredients: ["عين الجمل (جوز)", "بذور الشيا والكتان", "حبوب اللقاح", "مسحوق الجينسينغ"]
            },
            {
                id: 4,
                name: "خلطة بناء العضلات والتعافي السريع",
                category: "خلطات طاقة وعضلات",
                price: 220,
                unit: "500 غرام",
                rating: 4.8,
                image: "https://images.unsplash.com/photo-1579722820308-d74e571900a9?q=80&w=800&auto=format&fit=crop",
                badge: "للرياضيين 🏋️‍♂️",
                description: "بروتين طبيعي خام يعزز نمو العضلات ويرفع مستويات الطاقة أثناء التمارين دون أي مواد كيميائية.",
                ingredients: ["شوفان مطحون", "زبدة كاوكاو طبيعية", "بذور القرع والسمسم", "مسحوق الكاكاو الخام"]
            }
        ];

        function App() {
            const [cart, setCart] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [selectedCategory, setSelectedCategory] = useState("الكل");
            const [customerInfo, setCustomerInfo] = useState({ name: '', phone: '', city: '', address: '' });

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [cart, isCartOpen, selectedCategory]);

            // إضافة منتج للسلة
            const addToCart = (product) => {
                setCart(prevCart => {
                    const existing = prevCart.find(item => item.id === product.id);
                    if (existing) {
                        return prevCart.map(item => 
                            item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item
                        );
                    }
                    return [...prevCart, { ...product, quantity: 1 }];
                });
            };

            // تعديل الكمية
            const updateQuantity = (id, delta) => {
                setCart(prevCart => prevCart.map(item => {
                    if (item.id === id) {
                        const newQty = item.quantity + delta;
                        return newQty > 0 ? { ...item, quantity: newQty } : null;
                    }
                    return item;
                }).filter(Boolean));
            };

            // حساب الإجمالي
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            // إرسال الطلب عبر الواتساب
            const handleCheckout = (e) => {
                e.preventDefault();
                if (cart.length === 0) return;

                let message = `*طلب جديد من متجر بركة للشفاء* 🌿\n\n`;
                message += `*معلومات الزبون:*\n`;
                message += `- الاسم: ${customerInfo.name}\n`;
                message += `- الهاتف: ${customerInfo.phone}\n`;
                message += `- المدينة: ${customerInfo.city}\n`;
                message += `- العنوان: ${customerInfo.address}\n\n`;
                message += `*تفاصيل الطلبية:*\n`;

                cart.forEach((item, index) => {
                    message += `${index + 1}. ${item.name} (${item.unit}) x ${item.quantity} = ${item.price * item.quantity} درهم\n`;
                });

                message += `\n*الإجمالي النهائي:* ${totalPrice} درهم\n`;
                message += `\nيرجى تأكيد الطلب وتحديد موعد التسليم.`;

                const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
                window.open(url, '_blank');
            };

            const categories = ["الكل", "خلطات طاقة وعضلات", "منتجات النحل", "مكملات التركيز"];
            const filteredProducts = selectedCategory === "الكل" 
                ? productsData 
                : productsData.filter(p => p.category === selectedCategory);

            return (
                <div className="min-h-screen flex flex-col">
                    {/* شريط الإعلانات العلوي */}
                    <div className="bg-emerald-900 text-amber-300 text-xs py-2 px-4 text-center font-medium flex items-center justify-center gap-2">
                        <span>✨ التوصيل متوفر لجميع المدن المغربية | منتجات 100% طبيعية وخالية من المواد الحافظة</span>
                    </div>

                    {/* الهيدر */}
                    <header className="bg-white border-b border-amber-100 sticky top-0 z-30 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="w-12 h-12 rounded-full bg-emerald-800 text-amber-400 flex items-center justify-center font-black text-2xl shadow-md border-2 border-amber-400">
                                    🌿
                                </div>
                                <div>
                                    <h1 className="text-2xl font-black text-emerald-950 tracking-tight">بركة للشفاء</h1>
                                    <p className="text-xs text-amber-700 font-semibold">للمكملات والأغذية الطبيعية والأعشاب</p>
                                </div>
                            </div>

                            {/* زر السلة */}
                            <button 
                                onClick={() => setIsCartOpen(true)}
                                className="relative bg-emerald-800 hover:bg-emerald-900 text-white px-5 py-2.5 rounded-full font-bold flex items-center gap-2 transition-transform active:scale-95 shadow-md"
                            >
                                <i data-lucide="shopping-bag" className="w-5 h-5 text-amber-300"></i>
                                <span className="hidden sm:inline">السلة</span>
                                {cart.length > 0 && (
                                    <span className="bg-amber-500 text-emerald-950 text-xs w-6 h-6 rounded-full flex items-center justify-center font-black">
                                        {cart.reduce((a, b) => a + b.quantity, 0)}
                                    </span>
                                )}
                            </button>
                        </div>
                    </header>

                    {/* البانر الرئيسي */}
                    <section className="bg-gradient-to-b from-emerald-900 to-emerald-950 text-white py-16 px-4 relative overflow-hidden">
                        <div className="max-w-4xl mx-auto text-center relative z-10">
                            <span className="bg-amber-500/20 text-amber-300 border border-amber-400/30 text-xs px-4 py-1.5 rounded-full font-bold inline-block mb-4">
                                غداء وصحة من الطبيعة 🍯
                            </span>
                            <h2 className="text-3xl sm:text-5xl font-black mb-6 leading-tight text-amber-100">
                                استرجع نشاطك وقوتك البدنية والذهنية بمنتجات شفاء طبيعية 100%
                            </h2>
                            <p className="text-emerald-100 text-base sm:text-lg mb-8 max-w-2xl mx-auto font-light leading-relaxed">
                                نختار لكم أجود الأعشاب، الأغذية الملكية، والمكملات الطبيعية المصنوعة بكل عناية وإتقان لتعزيز طاقة جسمك وتركيزك يومياً.
                            </p>
                        </div>
                    </section>

                    {/* قسم المنتجات */}
                    <main className="max-w-7xl mx-auto px-4 py-12 flex-1 w-full">
                        {/* فلترة التصنيفات */}
                        <div className="flex flex-wrap items-center justify-center gap-3 mb-10">
                            {categories.map(cat => (
                                <button
                                    key={cat}
                                    onClick={() => setSelectedCategory(cat)}
                                    className={`px-5 py-2 rounded-full font-bold text-sm transition-all ${
                                        selectedCategory === cat
                                            ? 'bg-emerald-800 text-amber-300 shadow-md'
                                            : 'bg-white text-emerald-900 border border-emerald-100 hover:bg-emerald-50'
                                    }`}
                                >
                                    {cat}
                                </button>
                            ))}
                        </div>

                        {/* شبكة عرض المنتجات */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                            {filteredProducts.map(product => (
                                <div key={product.id} className="bg-white rounded-3xl border border-emerald-100 overflow-hidden shadow-lg hover:shadow-xl transition-all duration-300 flex flex-col justify-between group">
                                    <div>
                                        <div className="relative h-64 overflow-hidden bg-slate-100">
                                            <img src={product.image} alt={product.name} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"/>
                                            <span className="absolute top-4 right-4 bg-emerald-950/80 text-amber-300 text-xs font-bold px-3 py-1.5 rounded-full backdrop-blur-sm border border-amber-400/30">
                                                {product.badge}
                                            </span>
                                        </div>

                                        <div className="p-6">
                                            <div className="flex justify-between items-start mb-2">
                                                <h3 className="text-xl font-black text-emerald-950 leading-snug">{product.name}</h3>
                                            </div>
                                            <p className="text-xs text-amber-700 font-bold mb-3">{product.unit}</p>
                                            <p className="text-slate-600 text-sm mb-4 leading-relaxed">{product.description}</p>

                                            {/* المكونات الطبيعية */}
                                            {product.ingredients && (
                                                <div className="bg-amber-50/60 p-3 rounded-2xl border border-amber-100 mb-4">
                                                    <span className="text-xs font-bold text-emerald-900 block mb-1.5">🌱 المكونات الطبيعية:</span>
                                                    <div className="flex flex-wrap gap-1.5">
                                                        {product.ingredients.map((ing, i) => (
                                                            <span key={i} className="text-[11px] bg-white text-emerald-800 border border-emerald-100 px-2 py-0.5 rounded-md font-medium">
                                                                {ing}
                                                            </span>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>

                                    <div className="p-6 pt-0 border-t border-slate-100 mt-auto flex items-center justify-between">
                                        <div>
                                            <span className="text-xs text-slate-400 block font-medium">الثمن</span>
                                            <span className="text-2xl font-black text-emerald-900">{product.price} <span className="text-xs font-normal">درهم</span></span>
                                        </div>
                                        <button 
                                            onClick={() => addToCart(product)}
                                            className="bg-emerald-800 hover:bg-emerald-900 text-amber-300 px-5 py-3 rounded-2xl font-bold text-sm flex items-center gap-2 transition-all shadow-md active:scale-95"
                                        >
                                            <i data-lucide="plus-circle" className="w-4 h-4"></i>
                                            إضافة للسلة
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>

                    {/* نافذة السلة والطلب (Modal) */}
                    {isCartOpen && (
                        <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex justify-end">
                            <div className="bg-white w-full max-w-md h-full shadow-2xl flex flex-col justify-between overflow-hidden">
                                
                                {/* رأس السلة */}
                                <div className="p-5 bg-emerald-900 text-white flex justify-between items-center border-b border-emerald-800">
                                    <div className="flex items-center gap-2">
                                        <i data-lucide="shopping-bag" className="text-amber-400"></i>
                                        <h3 className="font-bold text-lg">سلة المشتريات</h3>
                                    </div>
                                    <button onClick={() => setIsCartOpen(false)} className="p-1 hover:bg-emerald-800 rounded-full">
                                        <i data-lucide="x" className="w-6 h-6 text-amber-300"></i>
                                    </button>
                                </div>

                                {/* قائمة العناصر */}
                                <div className="p-5 flex-1 overflow-y-auto space-y-4">
                                    {cart.length === 0 ? (
                                        <div className="text-center py-12 text-slate-400">
                                            <i data-lucide="shopping-cart" className="w-16 h-16 mx-auto mb-3 opacity-30"></i>
                                            <p className="font-bold">السلة فارغة حالياً</p>
                                        </div>
                                    ) : (
                                        cart.map(item => (
                                            <div key={item.id} className="flex items-center justify-between bg-slate-50 p-3 rounded-2xl border border-slate-200">
                                                <div className="flex items-center gap-3">
                                                    <img src={item.image} alt={item.name} className="w-14 h-14 object-cover rounded-xl"/>
                                                    <div>
                                                        <h4 className="font-bold text-sm text-emerald-950 line-clamp-1">{item.name}</h4>
                                                        <span className="text-xs text-emerald-800 font-bold">{item.price} درهم</span>
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-2 bg-white px-2 py-1 rounded-xl border border-slate-200">
                                                    <button onClick={() => updateQuantity(item.id, -1)} className="text-slate-500 hover:text-emerald-900 font-bold">-</button>
                                                    <span className="font-bold text-sm text-emerald-950 w-5 text-center">{item.quantity}</span>
                                                    <button onClick={() => updateQuantity(item.id, 1)} className="text-slate-500 hover:text-emerald-900 font-bold">+</button>
                                                </div>
                                            </div>
                                        ))
                                    )}

                                    {cart.length > 0 && (
                                        <form onSubmit={handleCheckout} className="mt-6 pt-6 border-t border-slate-200 space-y-3">
                                            <h4 className="font-bold text-emerald-900 text-sm mb-2">معلومات الشحن (للتوصيل):</h4>
                                            <input 
                                                type="text" 
                                                placeholder="الاسم الكامل" 
                                                required 
                                                value={customerInfo.name}
                                                onChange={e => setCustomerInfo({...customerInfo, name: e.target.value})}
                                                className="w-full text-sm p-3 border border-slate-300 rounded-xl focus:outline-emerald-800"
                                            />
                                            <input 
                                                type="tel" 
                                                placeholder="رقم الهاتف" 
                                                required 
                                                value={customerInfo.phone}
                                                onChange={e => setCustomerInfo({...customerInfo, phone: e.target.value})}
                                                className="w-full text-sm p-3 border border-slate-300 rounded-xl focus:outline-emerald-800"
                                            />
                                            <input 
                                                type="text" 
                                                placeholder="المدينة" 
                                                required 
                                                value={customerInfo.city}
                                                onChange={e => setCustomerInfo({...customerInfo, city: e.target.value})}
                                                className="w-full text-sm p-3 border border-slate-300 rounded-xl focus:outline-emerald-800"
                                            />
                                            <textarea 
                                                placeholder="العنوان السكني والتفاصيل" 
                                                required 
                                                value={customerInfo.address}
                                                onChange={e => setCustomerInfo({...customerInfo, address: e.target.value})}
                                                className="w-full text-sm p-3 border border-slate-300 rounded-xl focus:outline-emerald-800 h-20"
                                            ></textarea>

                                            {/* المجموع والتأكيد */}
                                            <div className="pt-4 border-t border-slate-200">
                                                <div className="flex justify-between items-center mb-4">
                                                    <span className="font-bold text-slate-600">المجموع الكلي:</span>
                                                    <span className="text-2xl font-black text-emerald-900">{totalPrice} درهم</span>
                                                </div>
                                                <button 
                                                    type="submit"
                                                    className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3.5 rounded-2xl font-bold flex items-center justify-center gap-2 shadow-lg transition-transform active:scale-95"
                                                >
                                                    <i data-lucide="message-circle" className="w-5 h-5"></i>
                                                    تأكيد الطلب عبر الواتساب
                                                </button>
                                            </div>
                                        </form>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* الفوتر */}
                    <footer className="bg-emerald-950 text-emerald-200 py-10 px-4 border-t border-emerald-900 text-center text-xs">
                        <div className="max-w-7xl mx-auto space-y-4">
                            <p className="font-bold text-amber-300 text-base">متجر بركة للشفاء 🌿</p>
                            <p className="text-slate-400">جميع المنتجات طبيعية ومحضرة بعناية لضمان الجودة والشفاء بإذن الله.</p>
                            <p>© 2026 بركة للشفاء - جميع الحقوق محفوظة.</p>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
